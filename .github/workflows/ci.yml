name: CI

on:
  # Every branch, not just main: a feature branch that only gets checked once someone
  # opens a PR is a branch you find out about late. Pushing is the moment to know.
  push:
  # Kept for pull requests from forks, whose pushes never reach this repo. Same-repo
  # PRs are filtered out at the job level below so they do not run twice.
  pull_request:

# A newer push to the same branch makes the run in flight irrelevant — cancel it rather
# than paying for a Docker build whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip the duplicate run when a PR comes from a branch in this repo — the push
    # event already covered it. Fork PRs have no such push, so they still run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # Postgres 17 matches the production image; the harness refuses any DB whose
    # name lacks "zeus_test", so the service database is named accordingly.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zeus
          POSTGRES_PASSWORD: zeus
          POSTGRES_DB: zeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus -d zeus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://zeus:zeus@localhost:5432/zeus_test?schema=public
      # env.ts validates these eagerly at import time — test:unit imports it directly
      # (not through the harness, which sets its own defaults), so it needs them set
      # here too, before the harness ever gets a chance to run.
      DATABASE_URL: postgresql://zeus:zeus@localhost:5432/zeus_test?schema=public
      APP_SECRET: ci-test-secret-not-used-anywhere-else-0123456789abcdef
      # ubuntu-latest ships pg_dump 16.x by default; pg_dump refuses to dump a server
      # newer than itself, and the service above runs 17 to match production. Points
      # at the matching client installed below instead of whatever is on PATH.
      PG_DUMP_PATH: /usr/lib/postgresql/17/bin/pg_dump

    steps:
      - uses: actions/checkout@v4

      # Node version comes from .nvmrc so Docker, local, and CI stay on one pin.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Matches the server version in the postgres service above — see PG_DUMP_PATH.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm test

      # A separate step from `npm test` because it is genuinely slower: coverage cannot
      # use --test-force-exit (that kills the process before the report prints), so the
      # run pays the database pool's idle wait the normal suite skips. The thresholds
      # are a ratchet set just under the measured figures — they exist to stop coverage
      # sliding, so raise them when it rises rather than leaving the slack.
      - name: Coverage must not slide
        working-directory: apps/api
        # DATABASE_URL and TEST_DATABASE_URL come from the job-level env above.
        run: npm run test:coverage

  # The Dockerfile is what actually gets deployed, so CI has to prove it still builds
  # *and* still boots. Its own job rather than a step above: a deploy break should read
  # as a deploy break instead of a test failure, and it runs in parallel with the tests.
  docker:
    # Skip the duplicate run when a PR comes from a branch in this repo — the push
    # event already covered it. Fork PRs have no such push, so they still run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    # packages: write is what lets a tag push publish the image to ghcr.io below.
    permissions:
      contents: read
      packages: write

    # The container is started with --network host below, so it reaches this at
    # localhost:5432 exactly as the app would reach a db service in production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zeus
          POSTGRES_PASSWORD: zeus
          POSTGRES_DB: zeus_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeus -d zeus_boot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # docker-compose.yml is the other half of the deploy artifact, and the boot check
      # below bypasses it (docker run, not compose) — so nothing here ever parsed it. An
      # unquoted colon in an error hint shipped for weeks and only failed on the server.
      # Parse it with the real tool, with the required variables stubbed.
      - name: Validate docker-compose.yml
        run: |
          POSTGRES_PASSWORD=x APP_SECRET=x APP_URL=http://localhost SEED_ADMIN_PASSWORD=x ZEUS_TAG=x \
            docker compose config --quiet

      # Never pushed. `load: true` puts the image in the local daemon so the boot check
      # below can actually run it. GHA layer caching keeps a repeat build to seconds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zeus-ci-check:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image only proves it compiles. This proves it *runs*: the entrypoint
      # waits for Postgres, applies migrations, seeds, and serves /api/health — the exact
      # sequence a real deploy performs, and the one a change to the data layer (a Prisma
      # major, a driver adapter, a Node bump) would break without touching a single test.
      - name: Boot the image and wait for it to serve traffic
        run: |
          docker run -d --name zeus-boot --network host \
            -e DATABASE_URL='postgresql://zeus:zeus@localhost:5432/zeus_boot?schema=public' \
            -e APP_SECRET='ci-boot-check-secret-not-used-anywhere-0123456789ab' \
            -e APP_URL='http://localhost:4000' \
            -e SEED_ADMIN_PASSWORD='CiBootCheck#2026' \
            -e RATE_LIMIT_MAX='5000' \
            zeus-ci-check:${{ github.sha }}

          # Entrypoint waits for the DB, migrates, then seeds — allow for all of it.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health > /tmp/health.json 2>/dev/null; then
              echo "healthy after ${i}s:"; cat /tmp/health.json; echo
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' zeus-boot)" != "true" ]; then
              echo "::error::container exited before becoming healthy"; break
            fi
            sleep 1
          done

          echo "::error::image did not serve /api/health within 60s"
          exit 1

      # The security headers live in the Caddyfile, so nothing in this workflow proved
      # they survive an edit — a CSP typo would only surface in production. Puts the real
      # reverse proxy in front of the container just booted above and asserts the headers
      # on a real response.
      #
      # --network host + --add-host app:127.0.0.1 is what lets the unmodified Caddyfile
      # work here: it proxies to `app:4000` (the compose service name), which resolves to
      # the app already listening on the host's port 4000. ZEUS_DOMAIN=:8080 is the
      # documented plain-HTTP mode, so no certificate is needed.
      - name: Check the reverse proxy sets the security headers
        run: |
          docker run -d --name zeus-caddy --network host \
            --add-host app:127.0.0.1 \
            -e ZEUS_DOMAIN=:8080 \
            -v "${{ github.workspace }}/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/api/health 2>/dev/null && break
            if [ "$(docker inspect -f '{{.State.Running}}' zeus-caddy)" != "true" ]; then
              echo "::error::caddy exited"; docker logs zeus-caddy 2>&1 | tail -30; exit 1
            fi
            sleep 1
          done

          headers=$(curl -sSI http://localhost:8080/api/health)
          echo "$headers"

          fail=0
          for h in content-security-policy permissions-policy strict-transport-security \
                   x-content-type-options x-frame-options referrer-policy; do
            grep -qi "^$h:" <<< "$headers" || { echo "::error::missing header: $h"; fail=1; }
          done

          # The Caddyfile strips it; a stray one means the directive stopped working.
          grep -qi '^server:' <<< "$headers" && { echo "::error::Server header not stripped"; fail=1; }

          # Spot-check the CSP actually constrains scripts rather than being permissive.
          csp=$(grep -i '^content-security-policy:' <<< "$headers")
          grep -q "script-src 'self'" <<< "$csp" || { echo "::error::CSP script-src is not 'self'"; fail=1; }

          exit $fail

      # Nothing else in this workflow opens a page. 427 API tests cover the routes and
      # five of the twenty-three defects this project has fixed were in the UI in front
      # of them — a switch drawn twice, a label that wrapped, a lookup menu that would
      # not close. These drive the real image already running above, so what is tested
      # is the artefact that ships rather than a dev server that differs from it.
      # The browser tests import @playwright/test, so this job needs the repo's own
      # dependencies — it builds an image and otherwise never installs anything. Without
      # this, npx fetches a standalone Playwright that cannot resolve the config's own
      # imports, which fails as MODULE_NOT_FOUND a long way from the cause.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install the browser-test dependencies
        run: npm ci --ignore-scripts

      - name: Browser journeys against the running image
        run: |
          npx playwright install --with-deps chromium
          E2E_URL=http://localhost:4000 \
          E2E_EMAIL=admin@protect24x7.ae \
          E2E_PASSWORD='CiBootCheck#2026' \
            npx playwright test -c e2e/playwright.config.ts

      - name: Keep the browser evidence when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # A release is a git tag (v1.2.3). Only then — and only after the image above
      # built, booted, migrated, seeded, served traffic and set its headers — is that
      # exact image published, so production pulls something CI has already run.
      # Branch pushes never publish: production runs explicit tags, never main.
      - name: Sign in to GitHub's container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          docker tag "zeus-ci-check:${{ github.sha }}" "$image"
          docker push "$image"
          echo "::notice::published $image — deploy with: ./docker/deploy.sh ${GITHUB_REF_NAME}"

      # Runs even on success: the logs are how you find out *why* a boot broke, and
      # they are worth having in the run record either way.
      - name: Container logs
        if: always()
        run: |
          echo "───── app ─────"; docker logs zeus-boot 2>&1 || true
          echo "───── caddy ─────"; docker logs zeus-caddy 2>&1 | tail -40 || true

      - name: Stop the containers
        if: always()
        run: docker rm -f zeus-boot zeus-caddy 2>/dev/null || true
