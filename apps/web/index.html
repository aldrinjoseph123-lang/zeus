<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Zeus — Protect24x7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M8 8h16l-9 8h9L8 24l9-8H8z' fill='%23e11d2e'/%3E%3C/svg%3E" />
    <script>
      /*
       * The theme, before the first paint — which means here, not in main.tsx.
       * main.tsx only runs once the bundle has arrived, so a dark-mode user on a
       * slow link got a white screen for the whole download and then a flip.
       * Layout.tsx reads this attribute back off the DOM at mount, so the toggle
       * keeps working unchanged.
       */
      try {
        var t = localStorage.getItem('zeus.theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /*
       * Boot splash. It lives inside #root, so React removes it the moment it
       * mounts — there is no teardown code and no way to leave it stuck on screen.
       *
       * It is invisible for the first 250ms. A warm cache or the office LAN mounts
       * inside that, so staff signing in twenty times a day never see it at all;
       * only a genuinely slow boot fades it up. Its own colours are inlined rather
       * than taken from theme.css, because theme.css ships in the bundle this is
       * covering for.
       */
      :root { --splash-bg: #ffffff; --splash-fg: #0a0a0a; --splash-dim: #d8d8d4; }
      :root[data-theme='dark'] { --splash-bg: #0a0a0a; --splash-fg: #ededed; --splash-dim: #2a2a2a; }
      body { margin: 0; background: var(--splash-bg); }

      #zeus-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--splash-bg);
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        animation: zeus-splash-in 200ms ease 250ms both;
      }
      #zeus-splash-word {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* letter-spacing trails a gap; nudge back to centre */
        color: var(--splash-fg);
      }
      #zeus-splash-bar {
        width: 132px;
        height: 2px;
        background: var(--splash-dim);
        overflow: hidden;
      }
      #zeus-splash-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #e11d2e;
        animation: zeus-splash-sweep 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes zeus-splash-in { from { opacity: 0 } to { opacity: 1 } }
      @keyframes zeus-splash-sweep {
        from { transform: translateX(-100%) }
        to { transform: translateX(330%) }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Still delayed, still fades in — just without the step. */
        #zeus-splash { animation-duration: 1ms }
        #zeus-splash-bar i { animation: none; width: 100% }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="zeus-splash" role="status" aria-label="Loading Zeus">
        <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M8 8h16l-9 8h9L8 24l9-8H8z" fill="#e11d2e" />
        </svg>
        <div id="zeus-splash-word">ZEUS</div>
        <div id="zeus-splash-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
