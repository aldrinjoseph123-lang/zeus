<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Zeus — Protect24x7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M8 8h16l-9 8h9L8 24l9-8H8z' fill='%23e11d2e'/%3E%3C/svg%3E" />
    <script>
      /*
       * The theme, before the first paint — which means here, not in main.tsx.
       * main.tsx only runs once the bundle has arrived, so a dark-mode user on a
       * slow link got a white screen for the whole download and then a flip.
       * Layout.tsx reads this attribute back off the DOM at mount, so the toggle
       * keeps working unchanged.
       */
      try {
        var t = localStorage.getItem('zeus.theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /*
       * Boot splash — "cold start".
       *
       * It lives inside #root, so React removes it the moment it mounts: there is
       * no teardown code and no way to leave it stuck over a working app. It stays
       * invisible for the first 250ms, so a warm cache or the office LAN never
       * flickers it; only a genuinely slow boot fades it up.
       *
       * Drawn in Zeus's own marks rather than a stock spinner — the hatch from
       * EmptyState, the square plate, the hairline, the uppercase micro-type, and
       * the app's own --ease-mechanical curve. A hard-edged band wipes across the
       * plate and lights the mark as it passes: one motion, one meaning, a machine
       * reading itself. Nothing here is faked — no invented progress percentage
       * and no checklist of things that were never checked.
       *
       * Its colours are inlined rather than taken from theme.css, because
       * theme.css ships in the bundle this is covering for.
       */
      :root {
        --splash-bg: #ffffff;
        --splash-line: #d8d8d4;
        --splash-dim: #b8b8b4;
        --splash-fg: #0a0a0a;
        --splash-mute: #6b6b6b;
        --splash-hatch: rgba(10, 10, 10, 0.05);
      }
      :root[data-theme='dark'] {
        --splash-bg: #0a0a0a;
        --splash-line: #2a2a2a;
        --splash-dim: #3d3d3d;
        --splash-fg: #ededed;
        --splash-mute: #a3a3a3;
        --splash-hatch: rgba(237, 237, 237, 0.05);
      }
      body { margin: 0; background: var(--splash-bg); }

      #zeus-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        animation: zeus-in 200ms ease 250ms both;
      }

      /* The plate: square, hairline, hatched — the same 45° rule EmptyState uses. */
      #zeus-plate {
        position: relative;
        width: 96px;
        height: 96px;
        border: 1px solid var(--splash-line);
        background-image: repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 7px,
          var(--splash-hatch) 7px,
          var(--splash-hatch) 8px
        );
        overflow: hidden;
      }
      .zeus-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The unlit mark. Always on screen, so the plate is never empty. */
      .zeus-dim path { fill: var(--splash-dim); }
      /* The lit mark, revealed left to right by the band. */
      #zeus-lit path { fill: #e11d2e; }
      #zeus-lit {
        clip-path: inset(0 100% 0 0);
        animation: zeus-scan 2200ms cubic-bezier(0.2, 0, 0, 1) 250ms infinite;
      }
      /* The read head, travelling with the band's leading edge. */
      #zeus-head {
        position: absolute;
        top: 0;
        left: 0;
        width: 1px;
        height: 100%;
        background: #e11d2e;
        animation: zeus-head 2200ms cubic-bezier(0.2, 0, 0, 1) 250ms infinite;
      }

      #zeus-word {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* letter-spacing trails a gap; nudge back to centre */
        color: var(--splash-fg);
      }
      #zeus-status {
        margin-top: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: var(--splash-mute);
      }

      @keyframes zeus-in { from { opacity: 0 } to { opacity: 1 } }
      /* Wipe on, hold, fade. One direction, so the pass reads as deliberate. */
      @keyframes zeus-scan {
        0%   { clip-path: inset(0 100% 0 0); opacity: 1 }
        50%  { clip-path: inset(0 0 0 0);    opacity: 1 }
        78%  { clip-path: inset(0 0 0 0);    opacity: 1 }
        100% { clip-path: inset(0 0 0 0);    opacity: 0 }
      }
      @keyframes zeus-head {
        0%   { transform: translateX(0);    opacity: 0 }
        6%   { opacity: 1 }
        50%  { transform: translateX(96px); opacity: 1 }
        62%  { transform: translateX(96px); opacity: 0 }
        100% { transform: translateX(96px); opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Nothing moves: the mark simply sits lit. Still delayed, still fades in. */
        #zeus-splash { animation-duration: 1ms }
        #zeus-lit { animation: none; clip-path: none }
        #zeus-head { display: none }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="zeus-splash" role="status" aria-label="Loading Zeus">
        <div id="zeus-plate">
          <span class="zeus-layer zeus-dim">
            <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8h16l-9 8h9L8 24l9-8H8z" /></svg>
          </span>
          <span class="zeus-layer" id="zeus-lit">
            <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8h16l-9 8h9L8 24l9-8H8z" /></svg>
          </span>
          <span id="zeus-head"></span>
        </div>
        <div id="zeus-word">ZEUS</div>
        <div id="zeus-status">STARTING</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
