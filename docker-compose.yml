# Zeus CRM — full stack on one Linux box.
#   docker compose up -d
# Caddy terminates TLS and gets a certificate automatically once ZEUS_DOMAIN
# points at this server. For a LAN-only install set ZEUS_DOMAIN=:80.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zeus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zeus} -d ${POSTGRES_DB:-zeus}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host — only the app container reaches it.
    expose:
      - '5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zeus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeus}?schema=public
      APP_SECRET: ${APP_SECRET:?generate with: openssl rand -hex 32}
      APP_URL: ${APP_URL:?e.g. https://zeus.protect24x7.ae}
      CORS_ORIGINS: ${APP_URL}
      NODE_ENV: production
      PORT: 4000
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@protect24x7.ae}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set a first-login password in .env}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      PG_DUMP_PATH: pg_dump
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
    volumes:
      - zeusdata:/data
    expose:
      - '4000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      ZEUS_DOMAIN: ${ZEUS_DOMAIN:-:80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  zeusdata:
  caddy_data:
  caddy_config:
